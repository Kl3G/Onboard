<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>DeleteSuccess</title>
</head>
<body>
    <script th:if="${msg != null}" th:inline="javascript">
        /*<![CDATA[*/
        alert([[${msg}]]);
        location.href = '/index';
        /*]]>*/
    </script>
    <script th:if="${msg == null}">
        alert("잘못된 접근입니다!");
        location.href = '/index';
    </script>
</body>
</html>
