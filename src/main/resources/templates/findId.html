<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>find_id</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../css/findId.css">
</head>
<body>
<header>
    <div class="divLogo__header">
        <a href="/index">
            Onboard
        </a>
    </div>
    <div class="divTitle__header">
        <a href="/index">
            Everyone's Board, Fun Trip
        </a>
    </div>
</header>

<main>
    <section>
        <div id="button_select">
            <button>IDを探す</button>
            <button id="button_findPwd">パスワードを再設定する</button>
        </div>
        <div class="divTitle__section">
            <h3 style="color: #29367c;">IDを探す</h3>
        </div>
        <form class="form__section" id="form__section" action="/findId_proc" method="post">
            <fieldset class="fieldset__section">
                <legend>IDを探す</legend>
                <p style="color: #d31900;">メールアドレスを入力して探す。</p>
                <p>&#8251; 会員登録時に入力したメールアドレスを入力してください。</p>
                <div class="mailGroup__fieldset group">
                    <div class="msgBox__mailGroup msgBox">
                        <input type="text" id="mail" name="mail" placeholder="メールアドレスを入力してください。">
                        <button type="submit">
                            確認
                        </button>
                    </div>
                </div>
            </fieldset>
        </form>
    </section>
</main>


<footer style="box-sizing: border-box;">
    <div>
        <ul class="footer__ul">
            <li style="min-width: 65px;">
                会社概要
                <span>|</span>
            </li>
            <li style="min-width: 65px;">
                利用規約
            </li>
        </ul>
    </div>
    <div>
        <span style="font-size: 12px;">Copyright ⓒ 2024 - 2025 ondoard. All rights reserved.</span>
    </div>
</footer>

<script src="../js/findId.js"></script>
</body>
</html>
