<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>infoModify</title>
    <link rel="stylesheet" href="../css/infoModify.css">
</head>
<body>
<header>
    <div class="divLogo__header">
        <a href="/index">
            Onboard
        </a>
    </div>
    <div class="divTitle__header">
        <a href="/index">
            Everyone's Board, Fun Trip
        </a>
    </div>
</header>

<main>
    <section>
        <div class="divTitle__section">
            <h3 style="color: #29367c;">会員情報更新</h3>
        </div>
        <form class="form__section" action="/join_proc" method="post">
            <fieldset class="fieldset__section">
                <legend>会員登録</legend>
                <div class="idGroup__fieldset">
                    <div class="title__form">ID</div>
                    <div class="msgBox__idGroup msgBox">
                        <input type="text" id="userid" name="userid" th:placeholder="${memberInfo.userid}"
                               readonly style="background-color: #f3f3f3; border: none; font-weight: bold;">
                    </div>
                </div>
                <div class="pwGroup__fieldset group">
                    <div class="title__form">パスワード</div>
                    <div class="msgBox__pwGroup msgBox">
                        <button class="modButton" type="button" onclick="window.location.href='/modifyPwd'">更新</button>
                    </div>
                </div>
                <div class="nickGroup__fieldset group">
                    <div class="title__form">ニックネーム</div>
                    <div class="msgBox__nickGroup msgBox">
                        <input type="text" id="nick" name="nick" th:placeholder="${memberInfo.nick}"
                               readonly style="background-color: #f3f3f3; border: none; font-weight: bold;">
                        <button class="modButton" type="button" onclick="window.location.href='/modifyNick'">更新</button>
                    </div>
                </div>
                <div class="mailGroup__fieldset group">
                    <div class="title__form">メールアドレス</div>
                    <div class="msgBox__mailGroup msgBox">
                        <input type="text" id="mail" name="mail" th:placeholder="${memberInfo.mail}"
                               readonly style="background-color: #f3f3f3; border: none; font-weight: bold;">
                        <button class="modButton" type="button" onclick="window.location.href='/modifyMail'">更新</button>
                    </div>
                </div>
                <div class="withdrawalGroup__fieldset group">
                    <button class="modButton withdrawalButton" type="button" onclick="window.location.href='/withdrawal'">会員脱退</button>
                </div>
            </fieldset>
        </form>
    </section>
</main>

<footer style="box-sizing: border-box;">
    <div>
        <ul class="footer__ul">
            <li style="min-width: 65px;">
                <a href="/intro">会社概要</a>
            </li>
        </ul>
    </div>
    <div>
        <span style="font-size: 12px;">Copyright ⓒ 2024 - 2025 ondoard. All rights reserved.</span>
    </div>
</footer>
</body>
</html>
