<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>newPwd</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="../css/newPwd.css">
</head>
<body>
<header>
    <div class="divLogo__header">
        <a href="/index">
            Onboard
        </a>
    </div>
    <div class="divTitle__header">
        <a href="/index">
            Everyone's Board, Fun Trip
        </a>
    </div>
</header>

<main>
    <section>
        <div id="button_select">
            <button id="button_findId">IDを探す</button>
            <button>パスワードを再設定する</button>
        </div>
        <div class="divTitle__section">
            <h3 style="color: #29367c;">パスワード再設定</h3>
        </div>
        <form class="form__section" action="/newPwd_proc" method="post">
            <fieldset class="fieldset__section">
                <legend>パスワード再設定</legend>
                <p id="policy">パスワードポリシー</p>
                <p>1. 英字、数字、記号を組み合わせなければいけません。</p>
                <p>2. 8から20文字の文字列を使用してください。</p>
                <div class="mailGroup__fieldset group">
                    <div class="msgBox__mailGroup msgBox">
                        <input type="hidden" name="mail" th:value=${memberInfo.mail}>
                        <input type="hidden" name="userid" th:value=${memberInfo.userid}>
                        <input type="text" id="newPwd" name="newPwd" placeholder="新しいパスワードを入力">
                        <input type="text" id="newPwdCheck" placeholder="新しいパスワードを再入力">
                        <button type="submit">
                            確認
                        </button>
                    </div>
                </div>
            </fieldset>
        </form>
    </section>
</main>


<footer style="box-sizing: border-box;">
    <div>
        <ul class="footer__ul">
            <li style="min-width: 65px;">
                <a href="/intro">会社概要</a>
            </li>
        </ul>
    </div>
    <div>
        <span style="font-size: 12px;">Copyright ⓒ 2024 - 2025 ondoard. All rights reserved.</span>
    </div>
</footer>

<script src="../js/setPwd.js"></script>
</body>
</html>
