<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>pwdNotFound</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <link rel="stylesheet" href="../css/setPwd.css">
</head>
<body>
<header>
  <div class="divLogo__header">
    <a href="/index">
      Onboard
    </a>
  </div>
  <div class="divTitle__header">
    <a href="/index">
      Everyone's Board, Fun Trip
    </a>
  </div>
</header>

<main>
  <section>
    <div id="button_select">
      <button id="button_findId">IDを探す</button>
      <button id="button_findPwd">パスワードを再設定する</button>
    </div>
    <div class="divTitle__section">
      <h3 style="color: #29367c;">会員照会結果</h3>
    </div>
    <form class="form__section" action="/findId_proc" method="post">
      <fieldset class="fieldset__section">
        <legend>IDを探す</legend>
        <p style="margin-bottom: 10px;">メールアドレスとIDをもう一度確認してください。</p>
        <div class="mailGroup__fieldset group">
          <div class="msgBox__mailGroup msgBox">
            <h3>入力された情報と一致する会員は見つかりませんでした。</h3>
          </div>
        </div>
      </fieldset>
    </form>
  </section>
</main>


<footer style="box-sizing: border-box;">
  <div>
    <ul class="footer__ul">
      <li style="min-width: 65px;">
        <a href="/intro">会社概要</a>
      </li>
    </ul>
  </div>
  <div>
    <span style="font-size: 12px;">Copyright ⓒ 2024 - 2025 ondoard. All rights reserved.</span>
  </div>
</footer>

<script src="../js/setPwd.js"></script>
</body>
</html>
